<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders - KaffySeni</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { font-family: 'Poppins', sans-serif; margin: 0; background: #fffaf5; }
    .container { width: 90%; max-width: 800px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #d4a017; }
    .order { border-bottom: 1px solid #eee; padding: 15px 0; }
    .order p { margin: 5px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Orders</h1>
    <div id="orders"></div>
  </div>

  <script>
    async function loadOrders() {
      const res = await fetch("/my-orders");
      if (res.status === 401) {
        alert("Please log in first!");
        window.location.href = "/login.html";
        return;
      }
      const orders = await res.json();
      const container = document.getElementById("orders");
      container.innerHTML = "";

      orders.forEach(order => {
        const items = JSON.parse(order.items);
        const div = document.createElement("div");
        div.classList.add("order");
        div.innerHTML = `
          <p><strong>Order #${order.id}</strong> — ${new Date(order.created_at).toLocaleString()}</p>
          <ul>
            ${items.map(i => `<li>${i.name} (₦${i.price} × ${i.quantity})</li>`).join("")}
          </ul>
          <p><strong>Total:</strong> ₦${order.total}</p>
        `;
        container.appendChild(div);
      });

      if (orders.length === 0) {
        container.innerHTML = "<p>No orders yet.</p>";
      }
    }

    loadOrders();
  </script>
</body>
</html>
